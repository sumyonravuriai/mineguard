services:
  - type: web
    name: mineguard-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mineguard-db
          property: connectionString
      - key: MQTT_BROKER_URL
        value: mqtt://broker.emqx.io:1883
      - key: MQTT_TOPIC_PREFIX
        value: mineguard/zones
      - key: HEARTBEAT_TIMEOUT_SECONDS
        value: 15
      - key: DEMO_MODE
        value: "false"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: mineguard-db
    plan: free
    databaseName: mineguard
    user: mineguard_admin
